[project]
name = "url-shortener-backend"
version = "0.1.0"
description = "FastAPI backend for the URL shortener"
# Language version: Python 3.10+ (developed against CPython 3.10.12).
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the backend root on sys.path so tests can `from app import ...` without an install step.
pythonpath = ["."]
